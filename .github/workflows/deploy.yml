# Test every push to main, then deploy the site and API proxy to Cloudflare.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy still waiting to run, but never interrupts one that has started.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # wrangler.jsonc runs `npm run build` (tsc and vite) before uploading.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.86.0
          command: deploy
